# ---------------------------------------------------------------------------
# simmrd parameter file — individual-level data
#
# Run with:
#   pixi run simulate --params params/example_individual.yaml --output results.rds
#
# All parameters map directly to set_params() arguments.
# Omitted parameters take their set_params() defaults; see ?set_params.
# ---------------------------------------------------------------------------

type: individual

# --- Study design ----------------------------------------------------------
sample_size_Xs: 50000
sample_size_Y:  50000
number_of_exposures:    2
number_of_causal_SNPs: 100

# --- GWAS overlap ----------------------------------------------------------
prop_gwas_overlap_Xs_and_Y: 0.5

# --- Pleiotropy (individual-data parameterisation) -------------------------
number_of_UHP_causal_SNPs:  0
number_of_CHP_causal_SNPs:  0
Y_variance_explained_by_UHP: 0
U_variance_explained_by_CHP: 0

# --- Causal effects (individual-data parameterisation) --------------------
Y_variance_explained_by_Xs: [0.3, 0.1]   # one value per exposure
signs_of_causal_effects:    [1, 1]

# --- Confounding -----------------------------------------------------------
Xs_variance_explained_by_U: 0.0
Y_variance_explained_by_U:  0.0

# --- Genetic architecture --------------------------------------------------
Xs_variance_explained_by_g: 0.10
genetic_correlation_Xs:     0.15
phenotypic_correlation_Xs:  0.3
LD_causal_SNPs:   "I"
number_of_LD_blocks: 1

# --- IV selection ----------------------------------------------------------
simtype:                weak      # "weak" fixes the mean F-statistic
fix_Fstatistic_at:      10
IV_Pvalue_threshold:    5.0e-8
MVMR_IV_selection_type: union
LD_pruning_r2:          1

# --- Output ----------------------------------------------------------------
MR_standardization: none
N_of_LD_ref:        .inf
